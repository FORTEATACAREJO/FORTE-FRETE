<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORTE FRETE</title><link rel="icon" href="favicon.svg">
<style>
:root{--r:#d71920;--dark:#760000;--bg:#f3f5f7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172033}header{background:linear-gradient(135deg,var(--dark),var(--r));color:#fff;padding:18px 22px;display:flex;gap:14px;align-items:center}.logo{width:54px;height:54px;border-radius:14px;background:#fff;color:var(--r);font-size:34px;font-weight:900;display:grid;place-items:center}h1{margin:0}.sub,.muted{font-size:13px;color:#64748b}header .sub{color:#fff;opacity:.9}main{max-width:1120px;margin:22px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001;margin-bottom:14px}.login{max-width:520px;margin:auto}.actions{display:grid;gap:9px}input{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #cbd5e1;border-radius:9px}button{width:100%;background:var(--r);color:#fff;border:0;border-radius:9px;padding:12px 15px;font-weight:bold;cursor:pointer}.secondary{background:#fff;color:var(--r);border:2px solid var(--r)}.link{background:transparent;color:#475569}.hidden{display:none!important}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.nav button{min-height:92px;text-align:left;background:#fff;color:#172033;border:1px solid #e2e8f0;box-shadow:0 2px 10px #0001}.nav strong{display:block;color:var(--r);font-size:17px;margin-bottom:6px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.top button{width:auto}.panel h2{margin-top:0}.notice{padding:12px;background:#fff7ed;border-radius:9px;font-size:14px}
</style></head>
<body><header><div class="logo">F</div><div><h1>FORTE FRETE</h1><div class="sub">Transporte que conecta</div></div></header>
<main>
<section id="auth" class="card login"><h2>Acesso</h2><input id="email" type="text" placeholder="CPF ou e-mail"><input id="senha" type="password" placeholder="Senha">
<div class="actions"><button id="entrar">ENTRAR</button><button id="cadastro" class="secondary">SOU MOTORISTA — QUERO ME CADASTRAR</button><button id="esqueci" class="link">RECUPERAR SENHA PELO WHATSAPP</button></div><p id="st" class="muted">A senha nunca é gravada neste dispositivo.</p></section>
<section id="home" class="hidden"><div class="top"><div><b>FORTE FRETE</b><div id="usuario" class="muted"></div></div><button id="sair">SAIR</button></div>
<div class="nav">
<button data-view="motoristas"><strong>Motoristas</strong>Cadastros, aprovação, veículos e rotas.</button>
<button data-view="rotas"><strong>Rotas e cargas</strong>Rotas oficiais e publicação de cargas.</button>
<button data-view="documentos"><strong>Documentos</strong>CNH, cavalo, carretas, Dolly e conjunto.</button>
<button data-view="viagens"><strong>Viagens</strong>Histórico de viagens, peso, frete e veículo.</button>
<button data-view="seguranca"><strong>Segurança</strong>Acesso protegido e dados privados.</button>
</div><section id="painel" class="card panel hidden"></section></section>
<section id="pre" class="card login hidden"><h2 id="preTitulo">Primeiro acesso do motorista</h2><p id="preTexto">Crie seu acesso. O e-mail é opcional.</p><div id="etapa1"><input id="prenome" placeholder="Nome completo"><input id="precpf" inputmode="numeric" placeholder="CPF"><input id="telefone" inputmode="tel" placeholder="WhatsApp com DDD"><input id="preemail" type="email" placeholder="E-mail (opcional)"><input id="presenha" type="password" placeholder="Criar senha"><input id="preconfirmar" type="password" placeholder="Confirmar senha"><div class="actions"><button id="criarAcesso">CRIAR PRÉ-CADASTRO</button><button class="link voltar">VOLTAR</button></div></div><form id="etapa2" class="hidden"><input id="endereco" placeholder="Endereço completo"><input id="cidadeUf" placeholder="Cidade/UF"><input id="pix" placeholder="Chave Pix"><input id="titularPix" placeholder="Titular da chave Pix"><input id="rntrc" placeholder="RNTRC"><input id="proprietario" placeholder="Nome do proprietário/transportadora"><input id="docProprietario" placeholder="CPF/CNPJ do proprietário"><label>CNH<input id="cnh" type="file" accept=".pdf,image/*"></label><label>Documento do cavalo<input id="cavalo" type="file" accept=".pdf,image/*"></label><label>Documento da carreta 1<input id="carreta1" type="file" accept=".pdf,image/*"></label><label>Dolly, se houver<input id="dolly" type="file" accept=".pdf,image/*"></label><label>Carreta 2, se houver<input id="carreta2" type="file" accept=".pdf,image/*"></label><label>Comprovante de endereço<input id="comprovante" type="file" accept=".pdf,image/*"></label><div class="actions"><button>ENVIAR PARA ANÁLISE</button><button type="button" id="sairPre" class="link">SAIR</button></div></form><p id="prest" class="muted">Após o envio, somente o administrador poderá aprovar e liberar funções.</p></section>
</main><script type="module" src="app.js"></script></body></html>
