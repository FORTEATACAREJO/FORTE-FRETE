<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forte Frete</title><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--navy:#0b1f3a;--blue:#174ea6;--green:#16834b;--red:#d71920;--orange:#d97706;--bg:#f4f7fb;--line:#dbe3ee;--text:#172033}*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.topbar{height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:900}.brand small{display:block;font-size:11px;font-weight:400;opacity:.8}.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 72px)}aside{background:#102947;color:#dbeafe;padding:16px 10px}.menu button{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:12px;border-radius:9px;margin:2px 0;cursor:pointer}.menu button:hover,.menu button.active{background:#1d4169;color:#fff}.content{padding:22px;max-width:1450px;width:100%;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #0b1f3a0a;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.kpi b{font-size:28px;display:block;margin-top:8px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#e8eef8}.ok{background:#dcfce7;color:#166534}.warn{background:#ffedd5;color:#9a3412}.bad{background:#fee2e2;color:#991b1b}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.light{background:#eef3f9;color:#19304f}.btn.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid .wide{grid-column:1/-1}label{font-weight:700;font-size:13px}input,select,textarea{width:100%;min-height:48px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;margin-top:5px;background:#fff}textarea{min-height:80px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf1f5;vertical-align:top}th{font-size:12px;color:#64748b}.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;padding:0}.loginwrap{max-width:560px;margin:45px auto;padding:0 16px}.loginhead{background:var(--navy);color:#fff;border-radius:18px 18px 0 0;padding:24px}.loginbody{background:#fff;padding:24px;border-radius:0 0 18px 18px}.step{font-size:12px;color:#64748b;margin-bottom:10px}.driverbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.notice{padding:12px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe}.mobileNav{display:none}.bigaction{min-height:62px;font-size:17px}.routechecks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.routechecks label{background:#f8fafc;padding:10px;border:1px solid var(--line);border-radius:8px}.routechecks input{width:auto;min-height:auto;margin:0 7px 0 0}
@media(max-width:800px){.shell{display:block}aside{display:none}.content{padding:14px}.formgrid{grid-template-columns:1fr}.topbar{height:64px}.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:9}.mobileNav button{flex:1;border:0;background:#fff;padding:12px 4px;font-size:11px}.content{padding-bottom:75px}table{font-size:13px}.tablewrap{overflow:auto}}
</style></head><body>
<div id="login" class="loginwrap"><div class="loginhead"><div class="brand">FORTE FRETE<small>Motoristas, cargas e viagens</small></div></div><div class="loginbody">
<h2>Acesso</h2><label>CPF ou e-mail<input id="loginId" autocomplete="username"></label><label>Senha<input id="loginPass" type="password" autocomplete="current-password"></label>
<div class="actions"><button id="btnLogin" class="btn">ENTRAR</button><button id="btnCadastro" class="btn light">PRIMEIRO ACESSO DO MOTORISTA</button></div><p id="loginMsg" class="step"></p></div></div>
<div id="cadastro" class="loginwrap hidden"><div class="loginhead"><div class="brand">CADASTRO DO MOTORISTA<small>Preencha em etapas. Seus dados ficam salvos no sistema.</small></div></div><div class="loginbody">
<div id="cadStep"></div><div class="actions"><button id="cadVoltar" class="btn light">VOLTAR</button><button id="cadAvancar" class="btn">AVANÇAR</button></div><p id="cadMsg" class="step"></p></div></div>
<div id="app" class="hidden"><div class="topbar"><div class="brand">FORTE FRETE<small id="userLine">Operação logística</small></div><div style="margin-left:auto" class="actions"><button id="trocarArea" class="btn light hidden">Trocar de área</button><button id="logout" class="btn red">Sair</button></div></div>
<div class="shell"><aside><div class="menu" id="menu"></div></aside><main class="content"><div id="view"></div></main></div><div class="mobileNav" id="mobileNav"></div></div>
<script type="module" src="app.js"></script></body></html>
