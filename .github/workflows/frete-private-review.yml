name: Frete private offers review
on:
  pull_request:
    paths: ['*.js', 'package*.json', 'tests/**', 'supabase/**', 'prototypes/**', '.github/workflows/frete-private-review.yml']
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: forte_test_private_offers
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-test-password
      PGDATABASE: forte_test_private_offers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/acceptance-edge.test.cjs tests/legacy-trip-edge.test.cjs tests/private-loads.test.cjs tests/auth-regression.cjs tests/frontend-regression.cjs tests/payment-regression.cjs tests/build-dependencies.cjs tests/export-regression.cjs tests/deletion-review-edge.cjs tests/access-standard/admin-edge.test.cjs tests/driver-referrals.mjs
      - name: Concurrent acceptance in independent database sessions
        run: bash tests/private-loads-concurrency.sh
      - name: Install browser for isolated UI tests
        run: npx playwright install --with-deps chromium
      - name: Test operation modules and visual proposal
        run: node tests/user-approval-save.browser.cjs && node tests/private-loads.browser.cjs && node tests/mobile-shell.browser.cjs && node tests/mobile-prototype.browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ForteFrete-Proposta-Mobile
          path: prototypes/screens/
          if-no-files-found: error
