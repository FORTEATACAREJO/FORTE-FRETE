name: Android APK and Store Build
on:
  push:
    branches: [main]
    paths: ['android-apk/**', 'favicon.svg', '.github/workflows/android-apk.yml', 'tests/**', 'supabase/functions/**', '*.js', 'index.html', 'icon-*.png', 'scripts/mobile-assets.py', 'store/**']
  pull_request:
    paths: ['android-apk/**', '*.js', '*.html', 'tests/**', 'icon-*.png', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Run regression tests
        run: |
          node tests/auth-regression.cjs
          node tests/export-regression.cjs
          node tests/freight-numeric-simulation.cjs
          node tests/frontend-regression.cjs
          node tests/payment-regression.cjs
          node tests/deletion-review-edge.cjs
          node tests/build-dependencies.cjs
          node --test tests/driver-referrals.mjs
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test signing backup without production credentials
        run: python3 tests/android-signing.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare official launcher icon
        run: |
          mkdir -p android-apk/app/src/main/res/drawable
          cp icon-512.png android-apk/app/src/main/res/drawable/app_icon.png
      - name: Build installable test APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: ForteFrete-APK-Teste
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare store signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FORTE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FORTE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORTE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORTE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'artifact=ForteFrete-AAB-Sem-Assinatura' >> "$GITHUB_OUTPUT"
            echo '### Assinatura pendente' >> "$GITHUB_STEP_SUMMARY"
            echo 'APK de testes disponível. O AAB não pode ser enviado à Play Store até configurar FORTE_KEYSTORE_BASE64, FORTE_KEYSTORE_PASSWORD, FORTE_KEY_ALIAS e FORTE_KEY_PASSWORD.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$configured" -ne 4 ]; then
            echo '::error::Configuração de assinatura incompleta: configure os quatro secrets FORTE_KEYSTORE_*.'
            exit 1
          else
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/forte-upload.jks"
            echo "FORTE_KEYSTORE_FILE=$RUNNER_TEMP/forte-upload.jks" >> "$GITHUB_ENV"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo 'artifact=ForteFrete-PlayStore-AAB-Assinado' >> "$GITHUB_OUTPUT"
          fi
      - name: Build release bundle
        working-directory: android-apk
        env:
          FORTE_KEYSTORE_PASSWORD: ${{ secrets.FORTE_KEYSTORE_PASSWORD }}
          FORTE_KEY_ALIAS: ${{ secrets.FORTE_KEY_ALIAS }}
          FORTE_KEY_PASSWORD: ${{ secrets.FORTE_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon --stacktrace
      - name: Verify store signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          jarsigner -verify android-apk/app/build/outputs/bundle/release/app-release.aab
          unzip -Z1 android-apk/app/build/outputs/bundle/release/app-release.aab | grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$'
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: android-apk/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/forte-upload.jks"
  android-launch:
    needs: validate-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ForteFrete-APK-Teste
          path: android-test-apk
      - name: Enable hardware acceleration on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open Android app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          script: python3 scripts/android-launch-test.py android-test-apk/app-debug.apk
      - name: Upload initial Android screen and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ForteFrete-Android-Abertura
          path: android-launch-results/
          if-no-files-found: warn
