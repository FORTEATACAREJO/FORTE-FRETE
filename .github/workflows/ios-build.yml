name: iOS - Build sem pagamento
on:
  push:
    branches: [main]
    paths: ['ios/**', 'scripts/mobile-assets.py', 'scripts/select-ios-simulator.py', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['ios/**', 'scripts/mobile-assets.py', 'scripts/select-ios-simulator.py', '.github/workflows/ios-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
      - name: Gerar projeto Xcode
        run: xcodegen generate --spec ios/project.yml
      - name: Preparar iPhone de teste
        id: device
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          device_id=$(python3 scripts/select-ios-simulator.py "$RUNNER_TEMP/devices.json")
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id"
      - name: Compilar para simulador
        run: |
          xcodebuild -project ios/ForteFrete.xcodeproj -scheme ForteFrete -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent build/ios-simulator/Build/Products/Debug-iphonesimulator/ForteFrete.app build/ForteFrete-Simulador.zip
      - name: Abrir aplicativo no simulador e capturar tela de teste
        id: simulator
        timeout-minutes: 8
        run: |
          device_id='${{ steps.device.outputs.id }}'
          xcrun simctl bootstatus "$device_id" -b
          codesign --force --deep --sign - build/ios-simulator/Build/Products/Debug-iphonesimulator/ForteFrete.app
          xcrun simctl install "$device_id" build/ios-simulator/Build/Products/Debug-iphonesimulator/ForteFrete.app
          xcrun simctl launch "$device_id" br.com.forteatacarejo.frete
          sleep 8
          xcrun simctl io "$device_id" screenshot build/ForteFrete-iOS-Tela-Teste.png
      - name: Validar compilação para dispositivo sem assinatura
        run: |
          xcodebuild -project ios/ForteFrete.xcodeproj -scheme ForteFrete -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent build/ios-device/Build/Products/Release-iphoneos/ForteFrete.app build/ForteFrete-iOS-Sem-Assinatura.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForteFrete-iOS-Validacao-Sem-Assinatura
          path: |
            build/ForteFrete-iOS-Tela-Teste.png
            build/ForteFrete-Simulador.zip
            build/ForteFrete-iOS-Sem-Assinatura.zip
          if-no-files-found: warn
      - name: Status honesto
        run: |
          if [ '${{ steps.simulator.outcome }}' != 'success' ]; then
            echo '### Abertura no simulador pendente' >> "$GITHUB_STEP_SUMMARY"
            echo 'O teste de abertura não concluiu. A compilação não equivale a validação de funcionamento em aparelho; conferir antes de publicar.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '### Compilação sem conta paga' >> "$GITHUB_STEP_SUMMARY"
          echo 'App de simulador e compilação de dispositivo sem assinatura. Não são IPA de distribuição e não podem ser enviados ao TestFlight/App Store. Assinatura, validação em dispositivo e envio ficam para a conta Apple Developer.' >> "$GITHUB_STEP_SUMMARY"
