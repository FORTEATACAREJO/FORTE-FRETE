name: Build Windows Desktop
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  APP_NAME: "Forte Frete"
  APP_FILE: "ForteFrete"
  APP_URL: "https://forte-frete.onrender.com"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop-windows | Out-Null
          Set-Content desktop-windows/main.js 'const {app,BrowserWindow,shell}=require("electron");const cfg=require("./app-config.json");function open(){const w=new BrowserWindow({width:1440,height:900,autoHideMenuBar:true,webPreferences:{contextIsolation:true,sandbox:true}});w.setTitle(cfg.name);w.webContents.setWindowOpenHandler(({url})=>{shell.openExternal(url);return {action:"deny"}});w.loadURL(cfg.url)}app.whenReady().then(open);app.on("window-all-closed",()=>{if(process.platform!=="darwin")app.quit()});'
          Set-Content desktop-windows/package.json '{"name":"forte-desktop","version":"1.0.0","main":"main.js","private":true,"devDependencies":{"electron":"^32.3.3","electron-builder":"^25.1.8"}}'
          @{name=$env:APP_NAME;url=$env:APP_URL} | ConvertTo-Json | Set-Content desktop-windows/app-config.json
      - name: Install dependencies
        working-directory: desktop-windows
        run: npm install
      - name: Build installer
        working-directory: desktop-windows
        run: npx electron-builder --win nsis --x64 --config.productName="$env:APP_NAME" --config.nsis.oneClick=false --config.nsis.allowToChangeInstallationDirectory=true --config.nsis.createDesktopShortcut=true --config.nsis.createStartMenuShortcut=true --config.artifactName="$env:APP_FILE-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: desktop-windows/dist/*.exe
